<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>

    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen max-w-md mx-auto bg-[#F4F5F7]">
    <div class="logo w-[263px] mx-auto pt-52">
        <img src="assets/Logo-full.png" alt="">
    </div>

    <div class="form mt-8">
        <div class="card bg-base-100 w-full shrink-0 shadow mx-auto rounded-3xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral text-base font-medium" for="phone">Mobile Number</label>
                    <input type="text" id="phone" class="input w-full rounded-full font-light text-base bg-base-200 border-0 h-[52px] px-4" placeholder="Enter your 11 digit number" maxlength="11" minlength="11" />

                    <label for="otp" class="label text-neutral text-base font-medium mt-3">4 Digit Pin</label>
                    <input id="otp" type="password" class="input w-full rounded-full font-light text-base bg-base-200 border-0 h-[52px] px-4" placeholder="Enter 4 Digit Pin" maxlength="4" minlength="4" />

                    <button id="loginBtn" class="btn btn-primary mt-4 rounded-full h-[52px] text-xl font-semibold text-white">Login</button>
                </fieldset>
            </div>
        </div>
    </div>

    <script src="scripts/login.js"></script>
</body>
</html>
